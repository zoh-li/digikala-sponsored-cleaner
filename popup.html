<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پاک‌ساز دیجی‌کالا</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app" data-enabled="true">
      <div class="backdrop" aria-hidden="true">
        <span></span><span></span>
      </div>

      <header class="header">
        <div class="identity">
          <div class="logo-wrap">
            <img id="extension-icon" src="icons/icon-128-on.png" alt="">
            <span class="online-dot" aria-hidden="true"></span>
          </div>
          <div class="identity-copy">
            <h1>پاک‌ساز دیجی‌کالا</h1>
            <p>تجربهٔ خرید تمیزتر و واقعی‌تر</p>
          </div>
        </div>

        <button id="github-link" class="github-icon" type="button" aria-label="مشاهدهٔ پروژه در گیت‌هاب" title="مشاهدهٔ پروژه در گیت‌هاب">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.75.12 3.04.74.8 1.18 1.82 1.18 3.08 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        </button>
      </header>

      <section class="control-card" aria-labelledby="status-title">
        <div class="control-accent" aria-hidden="true"></div>
        <div class="control-copy">
          <div class="state-line">
            <span class="state-dot" aria-hidden="true"></span>
            <span id="status-label">محافظت فعال</span>
          </div>
          <h2 id="status-title">فیلتر روشن است</h2>
          <p id="status-description">محصولات سفارشی خودکار حذف می‌شوند.</p>
        </div>

        <label class="toggle" aria-label="روشن یا خاموش‌کردن افزونه">
          <input id="enabled-toggle" type="checkbox" role="switch" checked>
          <span class="toggle-track" aria-hidden="true">
            <span class="toggle-knob">
              <svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.4a8 8 0 1 0 11.4 0"/></svg>
            </span>
          </span>
        </label>
      </section>

      <section class="stats" aria-label="آمار پاک‌سازی" aria-live="polite">
        <article class="stat">
          <span class="stat-icon stat-icon-red" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 4l16 16M9.8 5.2A11 11 0 0 1 12 5c5.5 0 9 5 9 5a13 13 0 0 1-2.3 2.8M6.2 6.3C4.1 7.8 3 10 3 10s3.5 5 9 5c1.1 0 2.1-.2 3-.5"/></svg>
          </span>
          <span class="stat-copy">
            <span class="stat-name">حذف‌شده</span>
            <span class="stat-detail">صفحهٔ فعلی</span>
          </span>
          <strong id="hidden-count" class="stat-number" dir="ltr">0</strong>
        </article>

        <span class="stats-divider" aria-hidden="true"></span>

        <article class="stat">
          <span class="stat-icon stat-icon-purple" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>
          </span>
          <span class="stat-copy">
            <span class="stat-name">شناسایی‌شده</span>
            <span class="stat-detail">این نشست</span>
          </span>
          <strong id="total-count" class="stat-number" dir="ltr">0</strong>
        </article>
      </section>

      <div id="page-status" class="page-status" role="status" hidden>
        <span class="page-status-icon" aria-hidden="true">
          <svg class="status-spinner" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/></svg>
          <svg class="status-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
          <svg class="status-warning" viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.8 2.4 18a2 2 0 0 0 1.8 3h15.6a2 2 0 0 0 1.8-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/></svg>
        </span>
        <p id="page-message"></p>
      </div>

      <button id="github-note" class="github-row" type="button">
        <span class="github-row-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.75.12 3.04.74.8 1.18 1.82 1.18 3.08 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        </span>
        <span class="github-row-text">به‌روزرسانی‌های افزونه را در گیت‌هاب دنبال کنید</span>
        <span class="github-row-arrow" aria-hidden="true">←</span>
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
