<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پاک‌ساز دیجی‌کالا</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>

      <header class="header">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M4 7h16M9 11v7m6-7v7M7 7l1-3h8l1 3M6 7l1 13h10l1-13"/>
          </svg>
        </div>
        <div>
          <h1>پاک‌ساز دیجی‌کالا</h1>
          <p>خداحافظ محصولات سفارشی!</p>
        </div>
        <button
          id="github-link"
          class="github-link"
          type="button"
          aria-label="مشاهدهٔ پروژه در گیت‌هاب"
          title="مشاهدهٔ پروژه در گیت‌هاب"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.75.12 3.04.74.8 1.18 1.82 1.18 3.08 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
          </svg>
        </button>
      </header>

      <section class="switch-card">
        <div>
          <strong id="status-title">فیلتر فعال است</strong>
          <span id="status-description">تبلیغات سفارشی مخفی می‌شوند</span>
        </div>
        <label class="switch" aria-label="روشن یا خاموش کردن افزونه">
          <input id="enabled-toggle" type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </section>

      <section class="stats" aria-live="polite">
        <div class="stat">
          <span id="hidden-count" class="number">0</span>
          <span>محصول حذف‌شده از نتایج</span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span id="total-count" class="number">0</span>
          <span>تبلیغ شناسایی‌شده در نشست</span>
        </div>
      </section>

      <p id="page-message" class="message">در حال بررسی صفحه…</p>

      <button id="github-note" class="github-note" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.75.12 3.04.74.8 1.18 1.82 1.18 3.08 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
        <span>نسخه‌های تازه اینجاست؛ پروژه را در گیت‌هاب دنبال کنید.</span>
        <span class="github-note-arrow" aria-hidden="true">←</span>
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
